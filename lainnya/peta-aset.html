<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peta Aset Digital - Transformasi Digital Kota Baubau 4.0</title>
  <meta name="description" content="Peta Lokasi Aset Digital Pemerintah Kota Baubau">
  <link rel="icon" href="../../assets/img/logo/logobaubau4.0.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#2F80ED',dark:'#1e3a5f',light:'#4A9AF5'},accent:{DEFAULT:'#F59E0B',light:'#FCD34D'}},fontFamily:{sans:['Plus Jakarta Sans','system-ui','sans-serif']}}}}</script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin=""/>
  <style>
    #map { height: calc(100vh - 80px); z-index: 1; margin-top: 80px; }
    #filter-buttons {
      position: absolute; top: 100px; right: 20px; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px); padding: 12px; z-index: 1000; border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); display: flex; flex-wrap: wrap; gap: 8px; max-width: 320px;
    }
    .filter-btn {
      background-color: white; border: 1px solid #e2e8f0; border-radius: 9999px;
      padding: 6px 12px; cursor: pointer; font-size: 12px; font-weight: 500;
      transition: all 0.2s ease; display: flex; items: center; gap: 6px;
    }
    .filter-btn.active { background-color: #2F80ED; color: white; border-color: #2F80ED; }
    .filter-btn:hover { background-color: #f1f5f9; }
    .filter-btn.active:hover { background-color: #1e3a5f; }
    .filter-btn img { width: 16px; height: 16px; object-fit: contain; }
  </style>
</head>
<body class="font-sans antialiased overflow-hidden">
  <!-- Ensure header background is solid for map page to prevent map bleeding under clear header -->
  <style>.fixed.top-0 { background-color: #1e3a5f !important; }</style>
  <div id="header-placeholder"></div>

  <!-- Map Container -->
  <div id="map"></div>
  <div id="filter-buttons"></div>

  <!-- Scripts -->
  <script src="../js/main.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin=""></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      var map = L.map('map').setView([-5.47, 122.6], 13);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
      }).addTo(map);

      var layersByCategory = {};
      var activeCategories = new Set();
      const iconBasePath = '../../assets/icon/';
      const categoriesWithIcons = ['Badan', 'Dinas', 'Inspektorat', 'Kecamatan', 'Kelurahan', 'Kesehatan', 'Lembaga Lain', 'Pendidikan', 'Lainnya'];
      const iconMapping = {};
      
      categoriesWithIcons.forEach(cat => {
        iconMapping[cat] = L.icon({
          iconUrl: iconBasePath + cat + '.png',
          iconSize: [32, 32], iconAnchor: [16, 32], popupAnchor: [0, -32]
        });
      });

      fetch('../../File/kotabaubau.json')
        .then(response => response.json())
        .then(data => {
          data.forEach(function (point) {
            var category = point.kategori || 'Lainnya';
            if (!layersByCategory[category]) {
              layersByCategory[category] = L.layerGroup();
            }
          });

          data.forEach(function (point, index) {
            if (point.Y && point.X) {
              setTimeout(function () {
                var category = point.kategori || 'Lainnya';
                var marker = iconMapping[category] ? L.marker([point.Y, point.X], { icon: iconMapping[category] }) : L.marker([point.Y, point.X]);
                var googleMapsUrl = "https://www.google.com/maps?q=" + point.Y + "," + point.X;
                var popupContent = `
                  <div class="font-sans">
                    <b class="text-sm text-slate-900">${point.Name}</b><br>
                    <span class="text-xs text-slate-500">Kategori: ${category}</span><br><br>
                    <a href="${googleMapsUrl}" target="_blank" class="text-blue-500 hover:text-blue-700 text-xs font-semibold inline-flex items-center gap-1">Lihat di Google Maps &rarr;</a>
                  </div>`;
                marker.bindPopup(popupContent);
                if (layersByCategory[category]) layersByCategory[category].addLayer(marker);
              }, index * 20); // Faster stagger
            }
          });

          var filterButtons = document.getElementById('filter-buttons');
          var categories = Object.keys(layersByCategory).sort();

          // "All" button
          var allButton = document.createElement('button');
          allButton.innerHTML = `<img src="${iconBasePath}Lainnya.png"> Semua`;
          allButton.className = 'filter-btn active';
          allButton.addEventListener('click', function () {
            if (activeCategories.size === categories.length) activeCategories.clear();
            else categories.forEach(cat => activeCategories.add(cat));
            updateMapAndButtons();
          });
          filterButtons.appendChild(allButton);

          // Category buttons
          categories.forEach(function (cat) {
            var button = document.createElement('button');
            var iconUrl = iconMapping[cat] ? iconMapping[cat].options.iconUrl : '';
            button.innerHTML = iconUrl ? `<img src="${iconUrl}"> ${cat}` : cat;
            button.className = 'filter-btn';
            button.dataset.category = cat;
            button.addEventListener('click', function () {
              activeCategories.has(cat) ? activeCategories.delete(cat) : activeCategories.add(cat);
              updateMapAndButtons();
            });
            filterButtons.appendChild(button);
            activeCategories.add(cat);
          });

          updateMapAndButtons();

          function updateMapAndButtons() {
            categories.forEach(function (cat) {
              var button = document.querySelector('.filter-btn[data-category="' + cat + '"]');
              if (activeCategories.has(cat)) {
                if (!map.hasLayer(layersByCategory[cat])) map.addLayer(layersByCategory[cat]);
                if (button) button.classList.add('active');
              } else {
                if (map.hasLayer(layersByCategory[cat])) map.removeLayer(layersByCategory[cat]);
                if (button) button.classList.remove('active');
              }
            });
            allButton.classList.toggle('active', activeCategories.size === categories.length);
          }
        })
        .catch(error => console.error('Error loading JSON:', error));
    });
  </script>
</body>
</html>
