<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" fill="none">
  <defs>
    <linearGradient id="mpadGradBlueW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="mpadGradGoldW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mpadShieldW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="mpadGlowW" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Symbol (Left) -->
  <g transform="translate(20, 20)">
    <!-- Base Shield -->
    <path d="M70 5 L125 28 C125 85 95 125 70 138 C45 125 15 85 15 28 Z" fill="url(#mpadShieldW)" stroke="#38BDF8" stroke-width="2.5" />
    <path d="M70 12 L117 32 C117 80 92 115 70 127 C48 115 23 80 23 32 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

    <!-- Bar Charts -->
    <rect x="36" y="65" width="12" height="42" rx="4" fill="url(#mpadGradBlueW)" />
    <rect x="52" y="48" width="12" height="59" rx="4" fill="url(#mpadGradBlueW)" />
    <rect x="68" y="34" width="12" height="73" rx="4" fill="url(#mpadGradGoldW)" />
    <rect x="84" y="52" width="12" height="55" rx="4" fill="url(#mpadGradBlueW)" />

    <!-- Trajectory Line -->
    <path d="M38 75 L58 55 L74 38 L90 56 L108 42" fill="none" stroke="url(#mpadGradGoldW)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="108" cy="42" r="5" fill="#FCD34D" filter="url(#mpadGlowW)" />

    <!-- Digital Node Ring -->
    <circle cx="70" cy="112" r="4" fill="#38BDF8" />
    <path d="M54 112 H64 M76 112 H86" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <g transform="translate(180, 42)">
    <!-- Brand Name: M-PAD -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#FFFFFF">M-</tspan><tspan fill="#38BDF8">P</tspan><tspan fill="#F59E0B">A</tspan><tspan fill="#34D399">D</tspan>
    </text>

    <!-- Version Badge -->
    <rect x="220" y="16" width="110" height="24" rx="12" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1"/>
    <text x="275" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#FCD34D" text-anchor="middle" letter-spacing="0.8">BAUBAU 4.0</text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="15" fill="#E2E8F0" letter-spacing="1.5">
      MANAJEMEN PENDAPATAN ASLI DAERAH
    </text>

    <!-- Authority -->
    <text x="0" y="102" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" letter-spacing="0.5">
      Badan Pendapatan Daerah (BAPENDA) Kota Baubau
    </text>
  </g>
</svg>
