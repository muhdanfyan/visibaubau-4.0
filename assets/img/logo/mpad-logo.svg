<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="mpadGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F80ED"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="mpadGradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="mpadGradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mpadShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="mpadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Icon Symbol (Left) -->
  <g transform="translate(20, 20)">
    <!-- Base Shield -->
    <path d="M70 5 L125 28 C125 85 95 125 70 138 C45 125 15 85 15 28 Z" fill="url(#mpadShield)" stroke="#2F80ED" stroke-width="2.5" />
    
    <!-- Outer Glow Rim -->
    <path d="M70 12 L117 32 C117 80 92 115 70 127 C48 115 23 80 23 32 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

    <!-- Bar Charts forming Stylized 'M' inside Shield -->
    <!-- Column 1 -->
    <rect x="36" y="65" width="12" height="42" rx="4" fill="url(#mpadGradBlue)" />
    <!-- Column 2 (Taller) -->
    <rect x="52" y="48" width="12" height="59" rx="4" fill="url(#mpadGradBlue)" />
    <!-- Center Peak/Arrow (Gold) -->
    <rect x="68" y="34" width="12" height="73" rx="4" fill="url(#mpadGradGold)" />
    <!-- Column 4 -->
    <rect x="84" y="52" width="12" height="55" rx="4" fill="url(#mpadGradBlue)" />

    <!-- Connecting Growth Line / Trajectory -->
    <path d="M38 75 L58 55 L74 38 L90 56 L108 42" fill="none" stroke="url(#mpadGradGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="108" cy="42" r="5" fill="#FCD34D" filter="url(#mpadGlow)" />

    <!-- Digital Node Ring (Center Bottom) -->
    <circle cx="70" cy="112" r="4" fill="#60A5FA" />
    <path d="M54 112 H64 M76 112 H86" stroke="#60A5FA" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(180, 42)">
    <!-- Brand Name: M-PAD -->
    <text x="0" y="52" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="52" letter-spacing="-1">
      <tspan fill="#1E3A5F">M-</tspan><tspan fill="#2F80ED">P</tspan><tspan fill="#F59E0B">A</tspan><tspan fill="#10B981">D</tspan>
    </text>

    <!-- Version / Flagship Tag -->
    <rect x="220" y="16" width="105" height="24" rx="12" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1"/>
    <text x="272" y="32" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#B45309" text-anchor="middle" letter-spacing="0.8">BAUBAU 4.0</text>

    <!-- Subtitle -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="15" fill="#334155" letter-spacing="1.5">
      MANAJEMEN PENDAPATAN ASLI DAERAH
    </text>

    <!-- Authority / Tagline -->
    <text x="0" y="102" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="0.5">
      Badan Pendapatan Daerah (BAPENDA) Kota Baubau
    </text>
  </g>
</svg>

